name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write  # Trusted publishing (no API token needed)

jobs:
  cadence:
    # docs/RELEASING.md "When to release": 14 days between releases unless
    # the CHANGELOG section says "Urgent release: <reason>".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags, to find the previous release

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check release cadence
        run: python tools/check_release_cadence.py --tag "${{ github.event.release.tag_name }}"

  build:
    needs: cadence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"  # keep in step with ci.yml
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
